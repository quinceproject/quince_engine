# Routing panelu Quince.
#
# _legacy_controller musi odpowiadać class_name zakładki zadeklarowanej w quince_engine.php —
# to po nim PrestaShop rozpoznaje uprawnienia do strony i podświetla pozycję w menu.
# _legacy_link pozwala starym linkom (Tools::redirectAdmin, getAdminLink) trafić na tę trasę.

quince_appearance:
  path: quince/appearance
  methods: [GET]
  defaults:
    _controller: Quince\Engine\Controller\Admin\AppearanceController::indexAction
    _legacy_controller: 'AdminQuinceAppearance'
    _legacy_link: 'AdminQuinceAppearance'

quince_appearance_save:
  path: quince/appearance/save
  methods: [POST]
  defaults:
    _controller: Quince\Engine\Controller\Admin\AppearanceController::saveAction
    _legacy_controller: 'AdminQuinceAppearance'
    _legacy_link: 'AdminQuinceAppearance:save'

# Podgląd palety bez zapisu. Paleta liczona jest wyłącznie w PHP (PaletteGenerator),
# więc panel pokazuje dokładnie te kolory, które trafią do sklepu — bez drugiej
# implementacji tej samej matematyki w JavaScripcie.
quince_appearance_preview:
  path: quince/appearance/preview
  methods: [POST]
  defaults:
    _controller: Quince\Engine\Controller\Admin\AppearanceController::previewAction
    _legacy_controller: 'AdminQuinceAppearance'
    _legacy_link: 'AdminQuinceAppearance'

# Ustawienia topbara — treści i widoczność. Kolory pasa wylicza silnik
# z decyzji w ustawieniach ogólnych, więc tutaj ich nie ma.
quince_topbar:
  path: quince/topbar
  methods: [GET]
  defaults:
    _controller: Quince\Engine\Controller\Admin\TopbarController::indexAction
    _legacy_controller: 'AdminQuinceTopbar'
