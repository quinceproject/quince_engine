  defaults:
    _controller: Quince\Engine\Controller\Admin\TopbarController::saveAction
    _legacy_controller: 'AdminQuinceTopbar'
    _legacy_link: 'AdminQuinceTopbar:save'

# Wyszukiwanie ikon dla selektora w panelu. Zestaw liczy ponad dwa tysiące pozycji,
# więc wynik pobiera się zapytaniem zamiast wpisywać całość w stronę.
quince_icons_search:
  path: quince/icons/search
  methods: [GET]
  defaults:
    _controller: Quince\Engine\Controller\Admin\IconController::searchAction
    _legacy_controller: 'AdminQuinceTopbar'
    _legacy_link: 'AdminQuinceTopbar'

